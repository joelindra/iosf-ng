[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iostester"
version = "0.1.0"
description = "iOS non-jailbreak network & API security testing toolkit (profile generator, IPA/resign+gadget, live TLS traffic interceptor, OWASP API Top 10 engine, HTML/PDF reports)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "iOSTester contributors" }]
dependencies = [
    "click>=8.1",
    "rich>=13",
    "httpx>=0.27",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "cryptography>=42",
    "h11>=0.14",
    "hpack>=4.0",
    "hyperframe>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "qrcode>=7.4",
]

[project.optional-dependencies]
device = ["pymobiledevice3>=4.0", "frida>=16"]
dev = ["pytest>=8"]

[project.scripts]
iostester = "iostester.cli:main"

[tool.setuptools]
packages = [
    "iostester",
    "iostester.core",
    "iostester.device",
    "iostester.profile_gen",
    "iostester.agent",
    "iostester.interceptor",
    "iostester.analyzer",
    "iostester.report",
    "iostester.dashboard",
    "iostester.resign",
]

[tool.setuptools.package-data]
iostester = [
    "agent/*.js",
    "analyzer/rules/*.yaml",
    "report/templates/*.j2",
    "dashboard/*.html",
    "resign/assets/*",
]
